id: write-fizzbuzz-script
category: code
sessions:
- Write a Python script fizzbuzz.py that takes a number n as its first command-line argument and prints
  the numbers 1 to n, one per line, but prints Fizz for multiples of 3, Buzz for multiples of 5 and FizzBuzz
  for multiples of both.
graders:
- type: unit_tests
  command: python -m pytest -q tests
